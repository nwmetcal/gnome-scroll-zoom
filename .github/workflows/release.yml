name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag vX.Y.Z publishes the bundle people download: scroll-zoom.shell-extension.zip.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the extension's version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("scroll-zoom@nhicc/metadata.json"))["version-name"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME does not match version-name $version" >&2
            exit 1
          fi
      - run: make zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Download **scroll-zoom.shell-extension.zip** below, then follow the steps in the [README](https://github.com/nwmetcal/gnome-scroll-zoom#install):"
            echo
            echo '```bash'
            echo 'gnome-extensions install --force ~/Downloads/scroll-zoom.shell-extension.zip'
            echo '```'
            echo
            echo "Log out and back in, then switch on Scroll Zoom in the Extensions app. Needs GNOME 50."
          } > build/notes.md
          gh release create "$GITHUB_REF_NAME" build/scroll-zoom.shell-extension.zip \
            --title "Scroll Zoom $GITHUB_REF_NAME" --notes-file build/notes.md --verify-tag
